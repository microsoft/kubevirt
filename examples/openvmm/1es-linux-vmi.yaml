apiVersion: kubevirt.io/v1
kind: VirtualMachineInstance
metadata:
  labels:
    special: 1es-linux
  name: 1es-linux
spec:
  domain:
    cpu:
      cores: 4
    memory:
      guest: 16Gi
    resources:
      requests:
        cpu: "4"
        memory: 16Gi
      limits:
        cpu: "4"
        memory: 16Gi
    firmware:
      bootloader:
        efi:
          secureBoot: true
    devices:
      disks:
      - disk:
          bus: vmbus
        name: rootdisk
      - disk:
          bus: vmbus
        name: cloudinitdisk
      interfaces:
      - bridge: {}
        name: default
      rng: {}
    resources: {}
  networks:
  - name: default
    pod: {}
  terminationGracePeriodSeconds: 0
  volumes:
  - dataVolume:
      name: 1es-linux-vhd
    name: rootdisk
  - cloudInitNoCloud:
      userData: |-
        #cloud-config
        users:
          - name: testuser
            gecos: Test User
            groups: [sudo, wheel]
            shell: /bin/bash
            sudo: ALL=(ALL) NOPASSWD:ALL
            password: p@ssw0rd!
            lock_passwd: false
        chpasswd:
          list: |
            testuser:p@ssw0rd!
          expire: false
        ssh_pwauth: true
    name: cloudinitdisk

